<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <script type="text/javascript">
        // A module script is always deferred, so homey.js can call onHomeyReady before the
        // bundle has run and defined it. Capturing the call here closes that race: the app
        // waits on this promise and gets the handover whichever side is ready first.
        window.homeyReady = new Promise(resolve => {
            window.onHomeyReady = resolve;
        });
    </script>

    <script
        type="text/javascript"
        src="/homey.js"
        data-origin="settings"></script>
</head>

<body id="app">
<script
    type="module"
    src="/src/main.ts"></script>
</body>
</html>
