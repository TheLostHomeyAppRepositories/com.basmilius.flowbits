<!doctype html>
<html>
<head lang="en">
    <title>Modes</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body class="homey-widget-full">

<div id="modes"></div>

<script type="text/javascript">
    function onHomeyReady(Homey) {
        const settings = Homey.getSettings();
        const group = settings.group?.name ?? '';

        let lastResult = null;
        let ready = false;
        let busy = false;
        let updateSequence = 0;

        async function init() {
            Homey.on('flowbits-mode-update', update);

            await update();
        }

        async function onClickMode(mode, button) {
            if (settings.readonly || busy) {
                return;
            }

            busy = true;

            try {
                Homey.hapticFeedback();
            } catch (_) {
                // care
            }

            // Optimistically reflect the switch so a second tap doesn't toggle it back.
            const wasActive = button.classList.contains('active');
            document.querySelectorAll('#modes .item.active').forEach(el => el.classList.remove('active'));

            if (!wasActive) {
                button.classList.add('active');
            }

            button.classList.add('loading');

            // The optimistic edit above made the DOM diverge from lastResult, so the
            // next update has to rebuild instead of skipping on an unchanged result.
            lastResult = null;

            try {
                await Homey.api('POST', '/', {mode: mode.name, group});
            } catch (err) {
                console.error('Switching mode failed.', err);
            } finally {
                busy = false;
                button.classList.remove('loading');
            }

            // Re-sync with the actual server state, also when the call above failed.
            await update();
        }

        async function update() {
            const sequence = ++updateSequence;
            const results = await Homey.api('GET', `/?group=${encodeURIComponent(group)}`);
            let elements = [];

            // A later update already rendered a newer state; this response is stale.
            if (sequence !== updateSequence) {
                return;
            }

            const resultsString = JSON.stringify(results);

            if (lastResult === resultsString) {
                return;
            }

            lastResult = resultsString;

            for (const result of results) {
                if (settings.filter && settings.filter.modes.length > 0 && !settings.filter.modes.includes(result.name)) {
                    continue;
                }

                const button = document.createElement('button');
                button.className = 'homey-widget item' + (result.active ? ' active' : '');
                button.addEventListener('click', () => onClickMode(result, button));

                if (settings.show_icons && result.icon) {
                    const icon = document.createElement('div');
                    icon.className = 'flowbits-icon item-icon';
                    icon.style.setProperty('--color', result.color);
                    icon.style.setProperty('--icon', JSON.stringify(result.icon));
                    icon.style.setProperty('--icon-secondary', JSON.stringify(result.icon + result.icon));
                    button.appendChild(icon);
                }

                const caption = document.createElement('div');
                caption.className = 'item-caption';
                button.appendChild(caption);

                const name = document.createElement('p');
                name.className = 'homey-text-medium';
                name.textContent = result.name;
                caption.appendChild(name);

                elements.push(button);
            }

            const modes = document.getElementById('modes');

            if (settings.readonly) {
                modes.setAttribute('data-readonly', 'true');
            } else {
                modes.removeAttribute('data-readonly');
            }

            if (settings.view_mode === 'grid') {
                modes.className = 'grid';
            } else {
                modes.className = 'list';
            }

            modes.innerText = '';
            elements.forEach(element => modes.appendChild(element));

            const height = modes.getBoundingClientRect().height;

            if (ready) {
                await Homey.setHeight(height);
            } else {
                Homey.ready({height});
                ready = true;
            }
        }

        init();
    }
</script>

</body>
</html>
